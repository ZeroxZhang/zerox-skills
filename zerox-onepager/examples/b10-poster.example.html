<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一页讲完 · Onepager 年度分享</title>
<!-- design intent: 单一视觉语言=切边巨字 + 大块暗场；强调色=红（香料），青仅作对位；字号比 272:11 ≈ 25:1 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0B0B10;
    --screen: #16161C;
    --line: #262838;
    --fg: #F5F5F7;
    --fg-2: #AEB2C0;
    --fg-3: #84868F;
    --red: #FE2C55;
    --cyan: #25F4EE;
    --font-display: 'Archivo', 'Noto Sans SC', 'PingFang SC', sans-serif;
    --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
  }

  body { background: #0B0B10; }

  .icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; }

  .poster {
    width: 1080px; height: 1440px;
    display: grid;
    grid-template-rows: 61% 32% 7%;
    align-content: start;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    overflow: hidden;
    position: relative;
  }

  /* ---------------- band 1: screen ---------------- */
  .screen {
    position: relative;
    background: var(--screen);
    padding: 54px 72px 40px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .rail {
    position: absolute;
    right: 44px; top: 340px;
    display: flex; flex-direction: column; gap: 26px;
    align-items: center;
    pointer-events: none;
  }
  .rail-item { display: flex; flex-direction: column; align-items: center; gap: 5px;
               font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .rail-item .icon { width: 28px; height: 28px; color: var(--fg-2); }

  .kicker {
    display: flex; align-items: center; gap: 14px;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--fg-3);
  }
  .kicker::before { content: ""; width: 44px; height: 1.5px; background: var(--red); }

  h1 {
    font-family: var(--font-display);
    font-size: 272px;
    line-height: 0.95;
    letter-spacing: -0.05em;
    font-weight: 800;
    margin: 30px 0 0 -12px;
    color: var(--fg);
  }
  h1 .line { display: block; }
  h1 .line + .line { margin-left: 88px; }

  /* B10 签名：双色错位。父级必须建立层叠上下文，否则负 z-index 会被底色吃掉 */
  .chromatic { position: relative; display: inline-block; z-index: 0; isolation: isolate; }
  .chromatic::before,
  .chromatic::after {
    content: attr(data-text);
    position: absolute; left: 0; top: 0; white-space: nowrap;
    pointer-events: none;
  }
  .chromatic::before { color: var(--cyan); transform: translate(-4px, -3px); z-index: -1; }
  .chromatic::after  { color: var(--red);  transform: translate(4px, 3px);  z-index: -2; }

  .sub {
    margin-top: 34px;
    font-size: 26px; line-height: 1.5; color: var(--fg-2); font-weight: 400;
    max-width: 700px;
  }
  .sub strong { color: var(--fg); font-weight: 700; }

  .meta-row {
    margin-top: auto;
    display: flex; align-items: center; gap: 16px;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--fg-3);
    position: relative; z-index: 2;
  }
  .meta-row .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); }

  .scrim {
    position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
    pointer-events: none;
    background: linear-gradient(to top, rgba(11, 11, 16, 0.94), rgba(11, 11, 16, 0));
  }

  /* ---------------- band 2: facts ---------------- */
  .info {
    border-top: 1.5px solid var(--line);
    padding: 44px 72px 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .fact .k {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px;
  }
  .fact .v { font-size: 46px; font-weight: 700; color: var(--fg); letter-spacing: -0.03em; line-height: 1; }
  .fact .v small { font-size: 15px; font-weight: 400; color: var(--fg-2); margin-left: 8px; letter-spacing: 0; }

  .agenda {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
    border-top: 1.5px solid var(--line);
    padding-top: 22px;
  }
  .agenda li { list-style: none; display: flex; gap: 12px; align-items: baseline; }
  .agenda .n { font-family: var(--font-mono); font-size: 12px; color: var(--red); letter-spacing: 0.08em; }
  .agenda .t { font-size: 20px; font-weight: 500; color: var(--fg); }
  .agenda .d { font-size: 13px; color: var(--fg-3); margin-left: 6px; }

  .credit {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--fg-3);
    display: flex; justify-content: space-between; align-items: center;
  }

  /* ---------------- band 3: full-bleed action bar (T4 例外：满宽红条 ≤8%) ---------------- */
  .action-bar {
    background: var(--red);
    color: #161823;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 72px;
    font-family: var(--font-body); font-size: 21px; font-weight: 700;
    letter-spacing: 0.01em;
  }
  .action-bar .left { display: inline-flex; align-items: center; gap: 12px; }
  .action-bar .icon { width: 22px; height: 22px; color: #161823; }
  .action-bar .right {
    font-family: var(--font-mono); font-size: 12px; font-weight: 400;
    letter-spacing: 0.1em; text-transform: uppercase; color: #161823;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></symbol>
  <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></symbol>
  <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
</svg>

<main class="poster">
  <section class="screen">
    <p class="kicker">Onepager 年度分享</p>

    <h1>
      <span class="line">一页</span>
      <span class="line"><span class="chromatic" data-text="讲完">讲完</span></span>
    </h1>

    <p class="sub">12 张海报，12 个真实项目。<strong>不聊方法论，只拆成品。</strong></p>

    <div class="rail">
      <div class="rail-item"><svg class="icon"><use href="#icon-heart"/></svg><span>2.4万</span></div>
      <div class="rail-item"><svg class="icon"><use href="#icon-chat"/></svg><span>312</span></div>
    </div>

    <div class="meta-row">
      <span>12.06 周六</span><span class="dot"></span><span>14:00 GMT+8</span>
      <span class="dot"></span><span>上海 · 西岸美术馆</span>
    </div>

    <div class="scrim"></div>
  </section>

  <section class="info">
    <div class="facts">
      <div class="fact"><div class="k">Date</div><div class="v">12.06<small>周六</small></div></div>
      <div class="fact"><div class="k">Time</div><div class="v">14:00<small>GMT+8</small></div></div>
      <div class="fact"><div class="k">Seats</div><div class="v">300<small>个座位</small></div></div>
    </div>

    <ol class="agenda">
      <li><span class="n">01</span><span class="t">版式<span class="d">怎么定结构</span></span></li>
      <li><span class="n">02</span><span class="t">字体<span class="d">怎么定声音</span></span></li>
      <li><span class="n">03</span><span class="t">交付<span class="d">怎么定标准</span></span></li>
    </ol>

    <p class="credit"><span>Host · Onepager</span><span>Venue · 西岸美术馆 B1</span></p>
  </section>

  <footer class="action-bar">
    <span class="left">报名 · onepager.design<svg class="icon"><use href="#icon-arrow"/></svg></span>
    <span class="right">Zerox &middot; 2026</span>
  </footer>
</main>
</body>
</html>
