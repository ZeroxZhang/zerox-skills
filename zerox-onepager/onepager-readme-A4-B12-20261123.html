<style>
  :root {
    --ink: #172644;
    --orange: #F25130;
    --paper: #F5F0DF;

    --body: 'Helvetica Neue', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
    --display: Impact, 'Arial Black', 'Helvetica Neue', sans-serif;
    --mono: Menlo, Consolas, 'PingFang SC', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body, h1, h2, p, figure, dl, dt, dd { margin: 0; }
  body { background: var(--paper); color: var(--ink); }
  .page {
    width: 1080px;
    height: 1440px;
    margin-inline: auto;
    display: grid;
    grid-template-rows: 98px 838px 392px 112px;
    align-content: start;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 26px;
    line-height: 1.5;
  }
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .masthead {
    margin: 32px 52px 0;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--ink);
  }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 700; letter-spacing: -.055em; }
  .brand svg { width: 35px; height: 35px; }
  .mono { font-family: var(--mono); font-size: 18px; font-weight: 400; letter-spacing: .04em; }
  .hero { position: relative; padding-top: 10px; }
  .display-art { display: block; width: 100%; height: 200px; }
  .display-art {
    font-family: var(--display);
    font-weight: 900;
    font-size: 184px;
    letter-spacing: -.025em;
  }
  .title-block { margin: 15px 52px 0; position: relative; z-index: 1; }
  h1 { font-size: 60px; font-weight: 900; line-height: 1.08; letter-spacing: -.06em; }
  .title-block .dek { margin-top: 12px; max-width: 455px; font-size: 26px; line-height: 1.5; }
  .engraving {
    position: absolute;
    inset: 225px 0 auto;
    width: 100%; height: 552px;
    pointer-events: none;
  }
  .plate-caption {
    display: flex; align-items: baseline; justify-content: space-between;
    position: absolute; left: 52px; right: 52px; bottom: 8px;
    pointer-events: none;
  }
  .plate-caption span:last-child { font-family: var(--body); letter-spacing: 0; }
  .spec {
    margin: 42px 52px 0;
    border-top: 4px solid var(--ink);
    padding-top: 22px;
    display: grid;
    grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
    grid-template-rows: 1fr;
    align-content: start;
    align-items: start;
    column-gap: 44px;
  }
  .spec h2 { font-size: 34px; font-weight: 700; line-height: 1.2; letter-spacing: -.04em; margin-bottom: 18px; }
  .figures { margin-top: 24px; font-size: 24px; letter-spacing: -.015em; }
  .figures strong { font-weight: 700; }
  .col-text { font-size: 26px; line-height: 1.55; }
  .actions { display: grid; grid-template-rows: repeat(3, auto); gap: 11px; }
  .actions div { display: grid; grid-template-columns: 58px 1fr; grid-template-rows: auto; gap: 16px; align-items: baseline; }
  .actions dt { font-weight: 700; }
  .actions dd { font-size: 24px; line-height: 1.55; }
  .footer {
    padding: 0 52px;
    display: flex; align-items: center;
    color: var(--paper); background: var(--ink);
  }
  .cta { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .cta { width: 100%; }
  .cta strong { font-size: 34px; line-height: 1.3; font-weight: 700; }
  .cta code { color: var(--paper); font-family: var(--mono); font-size: 34px; line-height: 1.3; font-weight: 700; }
</style>
</head>
